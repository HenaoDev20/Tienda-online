<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tienda Online - Iniciar sesión</title>

    <link rel="stylesheet" href="./css/estilos.css">
</head>

<body>

    <main class="contenedor-login">

        <section class="login-card">

            <h1>Iniciar sesión</h1>

            <p class="subtitulo">
                Ingresa a tu cuenta
            </p>

            <form id="loginForm">

                <div class="campo">

                    <label for="email">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Ingresa tu correo"
                        required
                    >

                </div>

                <div class="campo">

                    <label for="password">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Ingresa tu contraseña"
                        required
                    >

                </div>

                <button type="submit">
                    Iniciar sesión
                </button>

                <p id="mensaje"></p>

            </form>

            <p class="registro">
                ¿No tienes una cuenta?
                <a href="./registro.html">Crear cuenta</a>
            </p>

        </section>

    </main>

    <script src="./js/login.js"></script>

</body>

</html>
