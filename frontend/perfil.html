<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mi perfil - Tienda Online</title>

    <link
        rel="stylesheet"
        href="./css/estilos.css"
    >

</head>

<body>

    <main class="contenedor-login">

        <section class="login-card">

            <!-- =========================
                 INFORMACIÓN DEL USUARIO
            ========================== -->

            <h1>
                Mi perfil
            </h1>

            <p class="subtitulo">
                Información de tu cuenta
            </p>

            <div id="informacionUsuario">

                <p id="nombreUsuario">
                    Cargando nombre...
                </p>

                <p id="emailUsuario">
                    Cargando email...
                </p>

            </div>


            <!-- =========================
                 MIS PEDIDOS
            ========================== -->

            <hr>

            <h2>
                Mis pedidos
            </h2>

            <section id="listaPedidos">

                <p>
                    Cargando pedidos...
                </p>

            </section>

            

            


            <!-- =========================
                 MENSAJE
            ========================== -->

            <p id="mensaje"></p>


            <!-- =========================
                 CERRAR SESIÓN
            ========================== -->

            <button id="cerrarSesion">
                Cerrar sesión
            </button>

        </section>

    </main>


    <!-- =========================
         SCRIPTS
    ========================== -->

    <script src="./js/perfil.js"></script>

    <script src="./js/pedidos.js"></script>

</body>

</html>
