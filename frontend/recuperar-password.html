<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Recuperar contraseña - Tienda Online</title>

    <link
        rel="stylesheet"
        href="./css/estilos.css"
    >

</head>

<body>

    <main class="contenedor-login">

        <section class="login-card">

            <h1>
                Recuperar contraseña
            </h1>

            <p class="subtitulo">
                Ingresa tu correo electrónico para recuperar el acceso a tu cuenta.
            </p>

            <!-- =========================
                 FORMULARIO
            ========================== -->

            <form id="formularioRecuperacion">

                <label for="email">
                    Correo electrónico
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="correo@ejemplo.com"
                    required
                >

                <button type="submit">
                    Enviar solicitud
                </button>

            </form>

            <!-- =========================
                 MENSAJE
            ========================== -->

            <p id="mensaje"></p>

            <!-- =========================
                 VOLVER AL LOGIN
            ========================== -->

            <a href="index.html">
                Volver al inicio de sesión
            </a>

        </section>

    </main>

    <script src="./js/recuperar-password.js"></script>

</body>

</html>
