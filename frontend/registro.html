<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tienda Online - Crear cuenta</title>

    <link rel="stylesheet" href="./css/estilos.css">
</head>

<body>

    <main class="contenedor-login">

        <section class="login-card">

            <h1>Crear cuenta</h1>

            <p class="subtitulo">
                Regístrate para comenzar
            </p>

            <form id="registroForm">

                <div class="campo">

                    <label for="nombre">
                        Nombre
                    </label>

                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        placeholder="Ingresa tu nombre"
                        required
                    >

                </div>

                <div class="campo">

                    <label for="email">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Ingresa tu correo"
                        required
                    >

                </div>

                <div class="campo">

                    <label for="password">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Ingresa tu contraseña"
                        required
                    >

                </div>

                <button type="submit">
                    Crear cuenta
                </button>

                <p id="mensaje"></p>

            </form>

            <p class="registro">

                ¿Ya tienes una cuenta?

                <a href="./index.html">
                    Iniciar sesión
                </a>

            </p>

        </section>

    </main>

    <script src="./js/registro.js"></script>

</body>

</html>
